[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Defer legacy E731/E741 findings; the other selected lint rules are enforced in CI.
ignore = ["E731", "E741"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# Some strict module patterns are intentionally waiting for the M1 modules.
warn_unused_configs = false
warn_redundant_casts = true

# Keep legacy modules on default checking, suppressing only recorded baseline errors.
[[tool.mypy.overrides]]
module = ["taema.core.process", "taema.governor.engine", "taema.cli.commands"]
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "taema.core.lineage"
disable_error_code = ["var-annotated", "assignment"]

[[tool.mypy.overrides]]
module = "taema.store.knowledge"
disable_error_code = ["var-annotated", "assignment", "index", "union-attr"]

[[tool.mypy.overrides]]
module = "taema.daemon.service"
disable_error_code = [
  "var-annotated",
  "assignment",
  "arg-type",
  "index",
  "union-attr",
]

[[tool.mypy.overrides]]
module = [
  "taema.model",
  "taema.model.*",
  "taema.governor.guard",
  "taema.governor.memory_budget",
]
# Pure authorization/model and budget arithmetic modules use strict checking. The moved
# store and legacy governor implementations retain their existing gradual typing baseline.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.coverage.run]
source = ["src/taema"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 0

[tool.coverage.json]
pretty_print = true

[tool.taema.coverage]
minimum_new_percent = 85.0

# Existing floors use the whole-percent precision shown by `coverage report`.
# Floors were re-recorded from the CI report at 1.0.0: several modules
# (dash, notify, transfer, ...) never had baselines and two recorded
# floors had drifted above measured coverage.
