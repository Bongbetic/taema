[package]
name = "taema-attach"
version = "0.5.0"
edition.workspace = true
license.workspace = true

[lib]
name = "taema_attach"
path = "src/lib.rs"

[[bin]]
name = "taema-attach"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
