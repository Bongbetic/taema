[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Defer legacy E731/E741 findings; the other selected lint rules are enforced in CI.
ignore = ["E731", "E741"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# Some strict module patterns are intentionally waiting for the M1 modules.
warn_unused_configs = false
warn_redundant_casts = true

# Keep legacy modules on default checking, suppressing only recorded baseline errors.
[[tool.mypy.overrides]]
module = ["taema.inspect", "taema.engine", "taema.cli"]
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "taema.lineage"
disable_error_code = ["var-annotated", "assignment"]

[[tool.mypy.overrides]]
module = "taema.knowledge"
disable_error_code = ["var-annotated", "assignment", "index", "union-attr"]

[[tool.mypy.overrides]]
module = "taema.daemon"
disable_error_code = [
  "var-annotated",
  "assignment",
  "arg-type",
  "index",
  "union-attr",
]

[[tool.mypy.overrides]]
module = [
  "taema.authorization",
  "taema.authorization.*",
  "taema.model",
  "taema.model.*",
  "taema.store",
  "taema.store.*",
  "taema.governor",
  "taema.governor.*",
]
# New domain modules use strict checking as they are added.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.coverage.run]
source = ["src/taema"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 0

[tool.coverage.json]
pretty_print = true

[tool.taema.coverage]
minimum_new_percent = 85.0

# Existing floors use the whole-percent precision shown by `coverage report`.
[tool.taema.coverage.existing_baseline]
"src/taema/__init__.py" = 100
"src/taema/__main__.py" = 0
"src/taema/authorization.py" = 100
"src/taema/cgroup.py" = 86
"src/taema/cli.py" = 73
"src/taema/daemon.py" = 88
"src/taema/engine.py" = 90
"src/taema/inspect.py" = 96
"src/taema/knowledge.py" = 91
"src/taema/lineage.py" = 94
"src/taema/policy.py" = 95
