# Push a tag named taema-vX.Y.Z (X.Y.Z must equal __version__ in taema/src/taema/__init__.py).
# The workflow tests, builds the .xbps, signs an XBPS repository and attaches it, with the package,
# to the GitHub release (xbps reads it from releases/latest/download), then commits a bump of version and checksum in taema/srcpkgs/taema/template and in the README.
name: release

on:
  push:
    tags: ["taema-v*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc:latest
    steps:
      - name: Install build tools
        run: |
          xbps-install -Syu xbps
          xbps-install -Sy python3 bash iproute2 util-linux sudo make git shadow github-cli
      - uses: actions/checkout@v4
      - name: Check tag against version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' taema/src/taema/__init__.py)
          [ "${GITHUB_REF_NAME}" = "taema-v${version}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match __version__ ${version}" >&2; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Test and build
        run: |
          # The tests assume a normal user, so run them as one.
          useradd -m builder
          mkdir -p "$RUNNER_TEMP/repo"
          chown -R builder "$GITHUB_WORKSPACE" "$RUNNER_TEMP/repo"
          su builder -s /bin/sh -c "cd '$GITHUB_WORKSPACE/taema' && tools/build-xbps.sh '$RUNNER_TEMP/repo'"
      - name: Sign repository
        env:
          XBPS_PRIVKEY: ${{ secrets.XBPS_PRIVKEY }}
        run: |
          out="$RUNNER_TEMP/assets"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/repo/taema-${VERSION}_1.noarch.xbps" "$out/"
          [ -n "$XBPS_PRIVKEY" ] || { echo "secret XBPS_PRIVKEY is not set; publishing the package only" >&2; exit 0; }
          key="$RUNNER_TEMP/privkey.pem"
          umask 077
          printf '%s\n' "$XBPS_PRIVKEY" > "$key"
          umask 022
          cd "$out"
          # The package is noarch: index it for every architecture Void supports.
          for arch in x86_64 x86_64-musl i686 aarch64 aarch64-musl armv7l armv7l-musl armv6l armv6l-musl; do
            XBPS_ARCH=$arch xbps-rindex -a "taema-${VERSION}_1.noarch.xbps"
            XBPS_ARCH=$arch xbps-rindex --privkey "$key" --signedby "Bongbetic <soubarna@live.in>" -s .
          done
          xbps-rindex --privkey "$key" -S "taema-${VERSION}_1.noarch.xbps"
          rm -f "$key"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Add the repository once, then install and update like any other package:

          \`\`\`sh
          echo 'repository=https://github.com/${GITHUB_REPOSITORY}/releases/latest/download' | sudo tee /etc/xbps.d/20-taema.conf
          sudo xbps-install -S taema
          \`\`\`

          Later updates arrive with \`sudo xbps-install -Su\`. The first sync asks you to accept the
          repository key. Check that the fingerprint matches the README before you accept.
          NOTES
          cat CHANGELOG.md >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --title "tæma ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            "$RUNNER_TEMP"/assets/*

  template:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump template and README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#taema-v}
          sum=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          t=taema/srcpkgs/taema/template
          if grep -q "^version=${version}\$" "$t" && grep -q "^checksum=${sum}\$" "$t"; then
            echo "template already current"; exit 0
          fi
          sed -i "s/^version=.*/version=${version}/; s/^revision=.*/revision=1/; s/^checksum=.*/checksum=${sum}/" "$t"
          sed -i "s/taema-[0-9][0-9.]*_1\.noarch/taema-${version}_1.noarch/" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Template and README: taema ${version}"
          git push origin HEAD:main
